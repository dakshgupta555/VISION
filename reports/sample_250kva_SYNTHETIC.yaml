# SAMPLE TEST REPORT - SYNTHETIC VALUES. Not a real test certificate, not from
# any manufacturer, not CPRI data. A 250 kVA unit, to show the twin
# re-calibrating to a different rating (use with data/winter_250kva_5min.csv).
#   python -m dtwin.calibrate reports/sample_250kva_SYNTHETIC.yaml --show
report:
  name: "SAMPLE 250 kVA test report (synthetic values, not a real certificate)"
  illustrative: true
  note: "Synthetic values for demonstration only."
nameplate:
  rating_kva: 250
  hv_kv: 11
  lv_v: 433
  vector_group: Dyn11
  cooling: ONAN
  frequency_hz: 50
  impedance_pct: 4.5
open_circuit:
  p0_w: 560
  i0_pct: 1.6
short_circuit:
  pk_w: 3520
  reference_temp_c: 75   # already at the model's reference temperature
  impedance_pct: 4.48
heat_run:
  top_oil_rise_k: 52.0
  hotspot_gradient_k: 21.5
  tau_oil_h: 3.4
  tau_winding_min: 8
