#
# Why empty: these limits may only be entered from a source read directly. In
# the session that created this file (2026-10-11) the standard's text was not
# available: a web search found references to IS 1180 (Part 1):2014 Energy
# Efficiency Level-2 and Amendment 4 (BIS guideline, services.bis.gov.in) but
# not the table, and a utility tender specification (WBSEDCL, 25-160 kVA) could
# not be read without a PDF renderer. No number was taken from memory.
#
# While a cell is empty the dashboard's compliance row reads "not checked".
# Columns: maximum total losses in watts at 50 % and at 100 % load.
